<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play House - AO VIVO</title>
  <style>
    :root{
      --bg:#070712;
      --card:rgba(255,255,255,.06);
      --border:rgba(255,255,255,.12);
      --pink:#ff4fd8;
      --purple:#7b5cff;
      --blue:#19b7ff;
      --red:#ff2e2e;
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.68);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:radial-gradient(1200px 600px at 30% 0%, rgba(123,92,255,.18), transparent 55%),
                 radial-gradient(900px 500px at 90% 10%, rgba(25,183,255,.12), transparent 60%),
                 radial-gradient(700px 420px at 70% 90%, rgba(255,79,216,.10), transparent 55%),
                 var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
    }
    .wrap{width:min(1200px,100%);}
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 14px;
      border:1px solid var(--border);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border-radius:18px;
      margin-bottom:12px;
    }
    .title{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:900;
      letter-spacing:.08em;
    }
    .dot{
      width:10px; height:10px; border-radius:999px;
      background:var(--red);
      box-shadow:0 0 18px rgba(255,46,46,.75);
      animation:pulse 1.1s infinite;
    }
    @keyframes pulse{0%,100%{transform:scale(1); opacity:1}50%{transform:scale(1.45); opacity:.7}}
    .sub{color:var(--muted); font-weight:700; font-size:13px;}
    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
    }
    .player{
      border-radius:18px;
      overflow:hidden;
      border:1px solid var(--border);
      background:rgba(255,255,255,.03);
    }
    video{
      width:100%;
      display:block;
      aspect-ratio:16/9;
      background:#000;
    }
    .status{
      padding:10px 14px;
      border-top:1px solid rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      color:var(--muted);
      font-weight:700;
      font-size:13px;
    }
    .chip{
      padding:6px 10px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:999px;
      color:rgba(255,255,255,.84);
      background:rgba(0,0,0,.18);
    }
    @media (min-width: 900px){
      .grid{grid-template-columns: 1fr;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="title"><span class="dot" aria-hidden="true"></span> AO VIVO AGORA</div>
        <div class="sub">Live Streaming (próprio site)</div>
      </div>
      <div class="chip" id="liveState">Carregando...</div>
    </div>

    <div class="grid">
      <div class="player">
        <video
          id="liveVideo"
          controls
          playsinline
          autoplay
          muted
          preload="metadata"
        >
          <source src="streams/live.m3u8" type="application/vnd.apple.mpegurl" />
          Seu navegador não suporta reprodução deste stream.
        </video>
        <div class="status">
          <div>Player próprio do site</div>
          <div class="chip" id="liveMeta">Qualidade automática</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const video = document.getElementById('liveVideo');
      const state = document.getElementById('liveState');

      function set(msg){ if(state) state.textContent = msg; }
